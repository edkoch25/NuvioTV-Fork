name: Build Shield Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - nuvio-test
    paths:
      - app/**
      - DV7/**
      - gradle/**
      - gradlew
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/shield-test-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Enable bundled Dolby Vision conversion
        run: |
          printf '%s\n' \
            'DOVI_NATIVE_ENABLED=true' \
            'DOVI_EXTRACTOR_HOOK_READY=true' \
            'DOVI_ENABLE_REAL_LINK=true' \
            'DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi' \
            > local.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleFullRelease --stacktrace --no-daemon

      - name: Select and verify ARM64 APK
        id: apk
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*arm64-v8a*release.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.nuvio.tv.test'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "native-code: 'arm64-v8a'"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libdovi_bridge.so'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a.apk
          sha256sum Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a.apk > Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a.apk.sha256

      - name: Upload Shield test build
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a
          path: |
            Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a.apk
            Nuvio-Shield-Test-0.8.11-beta-nt1-ext2-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 14
